apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-stack

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  env: development
  managed-by: skaffold

# Configure image replacement to work with skaffold's image tagging
# Skaffold will replace these with actual built image digests/tags
images:
  - name: ghcr.io/berriai/litellm
    newTag: main-latest

secretGenerator:
  - name: litellm-secret
    literals:
      - master-key=sk-dev-master-key-12345678901234567890
      - openai-api-key=sk-proj-dev-key-test
      - anthropic-api-key=sk-ant-dev-key-test

patchesJson6902:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: litellm
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
