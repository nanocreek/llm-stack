apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: llm-stack

build:
  local:
    push: false
  artifacts:
    # LiteLLM (LLM Proxy) - Uses official image, no local build needed
    # Image is pulled directly from ghcr.io/berriai/litellm:main-latest

deploy:
  kubectl:
    manifests:
      - k8s/manifests.yaml
    defaultNamespace: llm-stack

portForward:
  # LiteLLM
  - resourceType: service
    resourceName: litellm
    namespace: llm-stack
    port: 4000
    localPort: 4000

  # PostgreSQL
  - resourceType: service
    resourceName: postgres
    namespace: llm-stack
    port: 5432
    localPort: 5432

  # Redis
  - resourceType: service
    resourceName: redis
    namespace: llm-stack
    port: 6379
    localPort: 6379

profiles:
  - name: minikube
    activation:
      - kubeContext: minikube
